<!doctype html>
<html lang="ko">
<head>
<title>사랑이의 식사메뉴 추천</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  /* Layout: 밥공기 마스코트 헤더 + 돌림판/결과(왼쪽) + 메뉴 목록(오른쪽). 좁은 화면에서는 한 줄로 쌓임. 스티커처럼 도톰한 버튼, 파스텔 점무늬 배경. */
  :root {
    --bg: #FFF6EC;
    --dots: #FFE0C2;
    --surface: #FFFFFF;
    --fg: #4F3328;
    --muted: #94705F;
    --line: #F6D5BC;
    --accent: #FF7B54;
    --accent-deep: #D95A34;
    --accent-ink: #FFFFFF;
    --pink: #FF8FB3;
    --lav: #9B8CFF;
    --mint: #6EDCC4;
    --mint-deep: #3FB79D;
    --mint-ink: #24493F;
    --soft: #FFEEDF;
    --sun: #FFD76A;
    --display: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #2E2230;
      --dots: #3B2D3E;
      --surface: #3D2E40;
      --fg: #FFEBDD;
      --muted: #CDAE9C;
      --line: #5C4561;
      --accent: #FF9068;
      --accent-deep: #C8532E;
      --accent-ink: #3A1A10;
      --pink: #FF9DBB;
      --lav: #B3A6FF;
      --mint: #7FE3CD;
      --mint-deep: #3FB79D;
      --mint-ink: #1E3A33;
      --soft: #4A3850;
      --sun: #FFD76A;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #2E2230;
    --dots: #3B2D3E;
    --surface: #3D2E40;
    --fg: #FFEBDD;
    --muted: #CDAE9C;
    --line: #5C4561;
    --accent: #FF9068;
    --accent-deep: #C8532E;
    --accent-ink: #3A1A10;
    --pink: #FF9DBB;
    --lav: #B3A6FF;
    --mint: #7FE3CD;
    --mint-deep: #3FB79D;
    --mint-ink: #1E3A33;
    --soft: #4A3850;
    --sun: #FFD76A;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background-color: var(--bg);
    background-image: radial-gradient(var(--dots) 2.5px, transparent 3px);
    background-size: 26px 26px;
    color: var(--fg);
    font-family: var(--body);
    font-size: 16px;
    line-height: 1.5;
    padding-block: 22px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    overflow-x: hidden;
  }
  .wrap { max-width: 980px; margin: 0 auto; }

  /* 헤더 */
  header { text-align: center; margin-bottom: 22px; position: relative; }
  .mascot { width: 112px; height: auto; display: block; margin: 0 auto 2px; overflow: visible; }
  .mascot .rice { fill: var(--surface); stroke: var(--line); stroke-width: 4; stroke-linejoin: round; }
  .mascot .bowl { fill: var(--accent); stroke: var(--accent-deep); stroke-width: 3; stroke-linejoin: round; }
  .mascot .shine { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; opacity: .6; }
  .mascot .face { fill: var(--fg); }
  .mascot .blush { fill: var(--pink); opacity: .6; }
  .mascot .smile { fill: none; stroke: var(--fg); stroke-width: 3; stroke-linecap: round; }
  .mascot .heart { fill: var(--pink); }
  .tag {
    display: inline-block;
    background: var(--lav);
    color: var(--accent-ink);
    font-family: var(--display);
    font-size: 15px;
    letter-spacing: 0.04em;
    padding: 3px 16px;
    border-radius: 999px;
    margin-bottom: 6px;
    transform: rotate(-3deg);
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag { color: #2E2230; } }
  :root[data-theme="dark"] .tag { color: #2E2230; }
  h1 {
    font-family: var(--display);
    font-weight: 400;
    font-size: clamp(32px, 8vw, 52px);
    line-height: 1.15;
    margin: 0;
    text-wrap: balance;
    color: var(--accent);
    text-shadow: 0 3px 0 var(--line), 0 6px 0 var(--soft);
  }
  .sub { margin: 10px 0 0; color: var(--muted); }
  .spark { position: absolute; width: 22px; height: 22px; fill: var(--sun); }
  .spark.a { left: 6%; top: 18px; } .spark.b { right: 8%; top: 40px; width: 16px; height: 16px; fill: var(--pink); }
  .spark.c { left: 14%; top: 98px; width: 14px; height: 14px; fill: var(--mint); } .spark.d { right: 15%; top: 8px; width: 14px; height: 14px; fill: var(--lav); }
  @media (max-width: 520px) { .spark.a { left: 0; } .spark.b { right: 0; } .spark.c, .spark.d { display: none; } }
  @media (prefers-reduced-motion: no-preference) {
    .mascot { animation: bob 2.6s ease-in-out infinite; }
    @keyframes bob { 0%, 100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-7px) rotate(2deg); } }
    .mascot .heart { animation: floaty 2.2s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .mascot .heart.h2 { animation-delay: 1.1s; }
    @keyframes floaty { 0%, 100% { transform: translateY(0) scale(1); opacity: 1; } 50% { transform: translateY(-5px) scale(1.2); opacity: .7; } }
    .mascot .eyes { animation: blink 4s infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 95% { transform: scaleY(.1); } }
    .spark { animation: twinkle 2.4s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .spark.b { animation-delay: .6s; } .spark.c { animation-delay: 1.2s; } .spark.d { animation-delay: 1.8s; }
    @keyframes twinkle { 0%, 100% { transform: scale(1) rotate(0); opacity: 1; } 50% { transform: scale(.55) rotate(25deg); opacity: .6; } }
    .tag { animation: wiggle 3.2s ease-in-out infinite; }
    @keyframes wiggle { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(2deg); } }
  }

  .stage { display: grid; grid-template-columns: 1fr; gap: 24px; align-items: start; }
  @media (min-width: 860px) { .stage { grid-template-columns: 1fr 1fr; gap: 32px; } }
  .stage > * { min-width: 0; }
  .col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

  .card {
    background: var(--surface);
    border: 3px solid var(--line);
    border-radius: 32px;
    padding: 20px;
    box-shadow: 0 7px 0 var(--line);
  }

  /* 돌림판 */
  .wheel-box { position: relative; width: 100%; max-width: 360px; margin: 6px auto 0; aspect-ratio: 1; }
  #wheel {
    display: block; width: 100%; height: 100%;
    border-radius: 50%;
    border: 6px solid var(--surface);
    box-shadow: 0 0 0 5px var(--accent), 0 9px 0 5px var(--accent-deep);
    transform: rotate(0deg);
  }
  .pointer {
    position: absolute; top: -16px; left: 50%; width: 40px; height: 46px;
    transform: translateX(-50%); z-index: 3;
    filter: drop-shadow(0 3px 0 rgba(0,0,0,.15));
  }
  .hub {
    position: absolute; left: 50%; top: 50%; width: 22%; aspect-ratio: 1;
    transform: translate(-50%, -50%);
    background: var(--surface); border: 5px solid var(--accent); border-radius: 50%; z-index: 2;
  }
  .eye { position: absolute; top: 36%; width: 12%; height: 17%; background: var(--fg); border-radius: 50%; }
  .eye.l { left: 26%; } .eye.r { right: 26%; }
  .cheek { position: absolute; top: 56%; width: 15%; height: 10%; background: var(--pink); opacity: .6; border-radius: 50%; }
  .cheek.l { left: 10%; } .cheek.r { right: 10%; }
  .mouth {
    position: absolute; left: 50%; top: 56%; width: 26%; height: 15%;
    transform: translateX(-50%);
    border-bottom: 3px solid var(--fg); border-radius: 0 0 50% 50%;
  }
  .hub.spinning .mouth { width: 13%; height: 17%; border: 3px solid var(--fg); border-radius: 50%; top: 58%; }
  @media (prefers-reduced-motion: no-preference) {
    .hub .eye { animation: blink 4s infinite; }
  }

  .spin-btn {
    display: block; width: 100%; margin-top: 28px;
    font-family: var(--display); font-size: 25px; letter-spacing: 0.03em;
    background: var(--accent); color: var(--accent-ink);
    border: 0; border-radius: 999px; padding: 14px 18px;
    box-shadow: 0 7px 0 var(--accent-deep);
    cursor: pointer;
    transition: transform .08s, box-shadow .08s;
  }
  .spin-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 0 var(--accent-deep); }
  .spin-btn:active { transform: translateY(6px); box-shadow: 0 1px 0 var(--accent-deep); }
  .spin-btn:disabled { opacity: .75; cursor: default; transform: translateY(4px); box-shadow: 0 3px 0 var(--accent-deep); }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--lav); outline-offset: 2px; }

  /* 결과 */
  .result {
    position: relative; margin-top: 20px; min-height: 96px;
    background: var(--soft); border: 3px dashed var(--line); border-radius: 26px;
    padding: 14px 16px; text-align: center;
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 2px;
    overflow: hidden;
  }
  .result .hint { color: var(--muted); }
  .result small { color: var(--muted); font-size: 15px; }
  .result .big-emoji { font-size: 46px; line-height: 1.1; }
  .result strong {
    font-family: var(--display); font-weight: 400; font-size: clamp(30px, 8vw, 40px);
    color: var(--accent); line-height: 1.2; overflow-wrap: anywhere; text-wrap: balance;
  }
  .kcal-badge {
    margin-top: 6px; display: inline-flex; align-items: baseline; gap: 6px;
    background: var(--sun); color: #5A3A00;
    font-family: var(--display); font-size: 22px;
    padding: 4px 16px; border-radius: 999px; box-shadow: 0 3px 0 rgba(0,0,0,.14);
  }
  .kcal-badge small { color: #5A3A00; opacity: .75; font-size: 13px; font-family: var(--body); }
  .kcal-badge.none { background: var(--surface); color: var(--muted); font-size: 15px; border: 2px dashed var(--line); box-shadow: none; }
  .comment { margin-top: 6px; color: var(--muted); font-size: 15px; }
  .result.pop .big-emoji, .result.pop strong { animation: pop .55s cubic-bezier(.3,1.6,.5,1); }
  @keyframes pop { 0% { transform: scale(.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  .confetti { position: absolute; top: -12px; width: 10px; height: 14px; border-radius: 3px; animation: fall 1.6s ease-in forwards; pointer-events: none; }
  @keyframes fall { to { transform: translateY(160px) rotate(540deg); opacity: 0; } }

  /* 운동 환산 */
  .burn h2 { color: var(--mint-deep); display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .burn-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
  .burn-top p { margin: 0; color: var(--muted); font-size: 14px; }
  .weight { display: inline-flex; align-items: center; gap: 6px; background: var(--soft); border-radius: 999px; padding: 4px 6px 4px 14px; font-size: 15px; }
  .weight input {
    width: 64px; font: inherit; font-size: 16px; color: var(--fg); text-align: center;
    background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 3px 4px;
  }
  .chips { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(138px, 1fr)); gap: 10px; }
  .chip {
    background: var(--soft); border: 3px solid transparent; border-radius: 22px;
    padding: 10px 10px 9px; text-align: center; min-width: 0;
  }
  .chip.star { border-color: var(--mint); background: var(--surface); box-shadow: 0 4px 0 var(--mint); }
  .chip .em { font-size: 30px; line-height: 1.1; display: block; }
  .chip .nm { display: block; font-size: 14px; color: var(--muted); }
  .chip .tm { display: block; font-family: var(--display); font-size: 21px; color: var(--fg); font-variant-numeric: tabular-nums; }
  .burn-note { margin: 12px 0 0; font-size: 13px; color: var(--muted); text-align: center; }
  .burn-empty { color: var(--muted); text-align: center; padding: 8px 4px; }

  /* 메뉴 목록 */
  h2 { font-family: var(--display); font-weight: 400; font-size: 25px; margin: 0 0 4px; color: var(--lav); }
  .count { color: var(--muted); margin: 0 0 14px; font-size: 14px; }

  .add-form { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .add-form input {
    min-width: 0;
    font: inherit; font-size: 17px; color: var(--fg);
    background: var(--surface); border: 3px solid var(--line); border-radius: 999px; padding: 9px 16px;
  }
  .add-form #newItem { flex: 1 1 150px; }
  .add-form #newKcal { flex: 0 1 112px; width: 112px; }
  .add-form input::placeholder { color: var(--muted); opacity: .8; }
  .add-btn {
    flex: none;
    font-family: var(--display); font-size: 18px;
    background: var(--mint); color: var(--mint-ink);
    border: 0; border-radius: 999px; padding: 9px 22px;
    box-shadow: 0 5px 0 var(--mint-deep);
    cursor: pointer; transition: transform .08s, box-shadow .08s;
  }
  .add-btn:active:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 var(--mint-deep); }
  .add-btn:disabled { opacity: .55; cursor: default; }
  .msg { min-height: 22px; margin: 0 0 6px 6px; font-size: 14px; color: var(--accent-deep); }

  ul.rows {
    list-style: none; margin: 0; padding: 2px 6px 6px 2px;
    display: flex; flex-direction: column; gap: 8px;
    max-height: 400px; overflow-y: auto;
  }
  .row {
    display: flex; align-items: center; gap: 8px;
    background: var(--soft); border: 3px solid transparent; border-radius: 999px; padding: 3px 8px 3px 12px;
  }
  .row.won { border-color: var(--accent); background: var(--surface); }
  .dot { flex: none; width: 18px; height: 18px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 2px var(--line); }
  .row .nm-in {
    flex: 1; min-width: 0;
    font: inherit; font-size: 17px; color: var(--fg);
    background: transparent; border: 0; padding: 8px 2px;
  }
  .row .nm-in::placeholder { color: var(--muted); opacity: .7; }
  .kc { flex: none; display: inline-flex; align-items: center; gap: 3px; color: var(--muted); font-size: 12px; }
  .kc input {
    width: 58px; font: inherit; font-size: 15px; color: var(--fg); text-align: right;
    background: var(--surface); border: 2px solid var(--line); border-radius: 999px; padding: 3px 8px;
    font-variant-numeric: tabular-nums;
  }
  .del {
    flex: none; width: 32px; height: 32px; border-radius: 50%;
    border: 0; background: var(--surface); color: var(--muted);
    font-size: 20px; line-height: 1; cursor: pointer;
    box-shadow: 0 2px 0 var(--line);
  }
  .del:hover:not(:disabled) { color: var(--accent-deep); }
  .del:disabled { opacity: .35; cursor: default; }

  .reset-btn {
    display: block; margin: 14px auto 0;
    font: inherit; font-size: 14px; color: var(--muted);
    background: transparent; border: 2px dashed var(--line); border-radius: 999px; padding: 6px 16px;
    cursor: pointer;
  }
  .reset-btn:hover { color: var(--accent-deep); border-color: var(--accent); }
  footer { text-align: center; margin-top: 26px; color: var(--muted); font-size: 14px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="spark a" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.6 9.4 L24 12 L14.6 14.6 L12 24 L9.4 14.6 L0 12 L9.4 9.4 Z"/></svg>
    <svg class="spark b" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.6 9.4 L24 12 L14.6 14.6 L12 24 L9.4 14.6 L0 12 L9.4 9.4 Z"/></svg>
    <svg class="spark c" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.6 9.4 L24 12 L14.6 14.6 L12 24 L9.4 14.6 L0 12 L9.4 9.4 Z"/></svg>
    <svg class="spark d" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 0 L14.6 9.4 L24 12 L14.6 14.6 L12 24 L9.4 14.6 L0 12 L9.4 9.4 Z"/></svg>
    <svg class="mascot" viewBox="0 0 120 104" aria-hidden="true">
      <g transform="translate(18 2) scale(.55)"><path class="heart" d="M60 12 C54 2 44 8 50 16 L60 24 L70 16 C76 8 66 2 60 12 Z"/></g>
      <g transform="translate(72 0) scale(.45)"><path class="heart h2" d="M20 12 C14 2 4 8 10 16 L20 24 L30 16 C36 8 26 2 20 12 Z"/></g>
      <path class="rice" d="M18 64 Q16 14 60 14 Q104 14 102 64 Z"/>
      <path class="shine" d="M34 38 Q38 26 50 22"/>
      <path class="bowl" d="M10 60 H110 Q108 96 60 98 Q12 96 10 60 Z"/>
      <g class="eyes"><circle class="face" cx="46" cy="42" r="4.5"/><circle class="face" cx="74" cy="42" r="4.5"/></g>
      <ellipse class="blush" cx="36" cy="52" rx="7" ry="4.5"/><ellipse class="blush" cx="84" cy="52" rx="7" ry="4.5"/>
      <path class="smile" d="M53 50 Q60 58 67 50"/>
    </svg>
    <span class="tag">오늘 뭐 먹지?</span>
    <h1>사랑이의 식사메뉴 추천</h1>
    <p class="sub">돌려돌려 돌림판! 칼로리랑 운동 시간까지 알려줄게요</p>
  </header>

  <main class="stage">
    <div class="col">
      <section class="card" aria-label="돌림판">
        <div class="wheel-box">
          <svg class="pointer" viewBox="0 0 38 44" aria-hidden="true">
            <path d="M19 42 L4 12 Q2 4 10 3 L28 3 Q36 4 34 12 Z" fill="#FF7B54" stroke="#FFFFFF" stroke-width="3.5" stroke-linejoin="round"/>
            <circle cx="19" cy="14" r="4.5" fill="#FFFFFF"/>
          </svg>
          <canvas id="wheel" width="720" height="720" role="img" aria-label="메뉴가 나뉜 돌림판"></canvas>
          <div class="hub" id="hub" aria-hidden="true">
            <span class="eye l"></span><span class="eye r"></span>
            <span class="cheek l"></span><span class="cheek r"></span>
            <span class="mouth"></span>
          </div>
        </div>
        <button class="spin-btn" id="spin" type="button">메뉴 뽑기!</button>
        <div class="result" id="result" aria-live="polite"></div>
      </section>

      <section class="card burn" id="burn" aria-label="운동 환산" hidden>
        <h2>이만큼 움직이면 소화 끝!</h2>
        <div class="burn-top">
          <p>내 몸무게로 계산해요</p>
          <label class="weight" for="weight">몸무게 <input type="number" id="weight" min="30" max="150" step="1" inputmode="numeric" value="55"> kg</label>
        </div>
        <ul class="chips" id="chips"></ul>
        <p class="burn-note" id="burnNote"></p>
      </section>
    </div>

    <section class="card" aria-label="메뉴 목록">
      <h2>메뉴 목록</h2>
      <p class="count" id="count"></p>
      <form class="add-form" id="addForm" autocomplete="off">
        <input type="text" id="newItem" maxlength="14" placeholder="먹고 싶은 메뉴를 적어요" aria-label="새 메뉴 이름">
        <input type="number" id="newKcal" min="1" max="3000" step="10" inputmode="numeric" placeholder="kcal (선택)" aria-label="칼로리 (선택)">
        <button class="add-btn" id="add" type="submit">추가</button>
      </form>
      <p class="msg" id="msg" aria-live="polite"></p>
      <ul class="rows" id="rows"></ul>
      <button class="reset-btn" id="reset" type="button">기본 메뉴로 되돌리기</button>
    </section>
  </main>

  <footer>칼로리는 1인분 기준 대략값이에요. 바꾼 메뉴는 이 브라우저에 저장돼요</footer>
</div>

<script>
(function () {
  var PALETTE = ['#FFB3C7','#BFD7FF','#FFE29A','#BDEBD3','#D9C7FF','#FFC9A8','#A9E5EA','#F7B8EA','#CDEBA3','#FFD0D0','#B6C4FF','#F5E1A4'];
  // [이름, 1인분 대략 kcal, 이모지]
  var DEFAULTS = [
    ['김치찌개', 450, '🍲'], ['된장찌개', 400, '🥘'], ['비빔밥', 640, '🍚'], ['불고기', 520, '🥩'],
    ['삼겹살', 750, '🥓'], ['치킨', 900, '🍗'], ['떡볶이', 560, '🌶️'], ['김밥', 480, '🍙'],
    ['라멘', 600, '🍜'], ['초밥', 500, '🍣'], ['돈까스', 900, '🍱'], ['파스타', 650, '🍝'],
    ['피자', 600, '🍕'], ['햄버거', 550, '🍔'], ['쌀국수', 450, '🥢'], ['마라탕', 700, '🔥']
  ];
  // 운동별 MET (칼로리/시간 = MET x 몸무게kg)
  var ACTIVITIES = [
    { n: '스피닝', e: '🚴', met: 8.5, star: true },
    { n: '러닝', e: '🏃', met: 9.0, star: true },
    { n: '걷기', e: '🚶', met: 3.5 },
    { n: '등산', e: '🥾', met: 6.5 },
    { n: '수영', e: '🏊', met: 6.0 },
    { n: '줄넘기', e: '🤸', met: 11.0 },
    { n: '계단 오르기', e: '🪜', met: 8.0 },
    { n: '요가', e: '🧘', met: 2.5 }
  ];
  var MAX = 24, MIN = 2, KEY = 'sarang-menu-v2', OLD_KEY = 'sarang-menu-items', WKEY = 'sarang-weight', SPIN_MS = 4800;
  var FALLBACK_EMOJI = '🍽️';

  var canvas = document.getElementById('wheel');
  var ctx = canvas.getContext('2d');
  var rowsEl = document.getElementById('rows');
  var form = document.getElementById('addForm');
  var newInput = document.getElementById('newItem');
  var newKcal = document.getElementById('newKcal');
  var addBtn = document.getElementById('add');
  var spinBtn = document.getElementById('spin');
  var resultEl = document.getElementById('result');
  var burnEl = document.getElementById('burn');
  var chipsEl = document.getElementById('chips');
  var burnNote = document.getElementById('burnNote');
  var weightEl = document.getElementById('weight');
  var countEl = document.getElementById('count');
  var msgEl = document.getElementById('msg');
  var resetBtn = document.getElementById('reset');
  var hub = document.getElementById('hub');

  function defaultItems() { return DEFAULTS.map(function (d) { return { n: d[0], k: d[1], e: d[2] }; }); }
  function lookupDefault(name) {
    for (var i = 0; i < DEFAULTS.length; i++) if (DEFAULTS[i][0] === name.trim()) return DEFAULTS[i];
    return null;
  }
  function okItem(o) { return o && typeof o.n === 'string' && (o.k === null || typeof o.k === 'number') && typeof o.e === 'string'; }

  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) {
        var arr = JSON.parse(raw);
        if (Array.isArray(arr) && arr.length >= MIN && arr.length <= MAX && arr.every(okItem)) return arr;
      }
      var old = localStorage.getItem(OLD_KEY);
      if (old) {
        var names = JSON.parse(old);
        if (Array.isArray(names) && names.length >= MIN && names.length <= MAX && names.every(function (s) { return typeof s === 'string'; })) {
          return names.map(function (s) {
            var d = lookupDefault(s);
            return d ? { n: s, k: d[1], e: d[2] } : { n: s, k: null, e: FALLBACK_EMOJI };
          });
        }
      }
    } catch (e) {}
    return null;
  }
  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(items)); } catch (e) {}
  }
  function loadWeight() {
    try {
      var w = Number(localStorage.getItem(WKEY));
      if (w >= 30 && w <= 150) return w;
    } catch (e) {}
    return 55;
  }
  function saveWeight(w) {
    try { localStorage.setItem(WKEY, String(w)); } catch (e) {}
  }

  var items = load() || defaultItems();
  var rotation = 0;
  var spinning = false;
  var timer = null;
  var resetArmed = false;
  var resetTimer = null;
  var lastWinner = null;
  weightEl.value = String(loadWeight());

  function colorAt(i, n) {
    var c = PALETTE[i % PALETTE.length];
    if (i > 0 && i === n - 1 && i % PALETTE.length === 0) c = PALETTE[6];
    return c;
  }

  function valid() {
    var out = [];
    items.forEach(function (t, i) { var s = t.n.trim(); if (s) out.push({ text: s, i: i, k: t.k, e: t.e }); });
    return out;
  }

  var FONT = 'Jua, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif';
  function fitText(text, maxWidth, size) {
    var s = size;
    ctx.font = s + 'px ' + FONT;
    while (ctx.measureText(text).width > maxWidth && s > 16) {
      s -= 2;
      ctx.font = s + 'px ' + FONT;
    }
    var t = text;
    while (ctx.measureText(t).width > maxWidth && t.length > 1) {
      t = t.slice(0, -1);
      if (ctx.measureText(t + '…').width <= maxWidth) { t = t + '…'; break; }
    }
    return t;
  }

  function drawWheel() {
    var W = canvas.width, c = W / 2, r = c - 6;
    ctx.clearRect(0, 0, W, W);
    var list = valid();
    var n = list.length;
    if (n < 2) {
      ctx.fillStyle = '#FFEEDF';
      ctx.beginPath(); ctx.arc(c, c, r, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#94705F';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '38px ' + FONT;
      ctx.fillText('메뉴를 2개 이상', c, c - 74);
      ctx.fillText('적어주세요', c, c - 74 + 48);
      return;
    }
    var seg = (Math.PI * 2) / n;
    for (var k = 0; k < n; k++) {
      var a0 = -Math.PI / 2 + k * seg;
      ctx.beginPath();
      ctx.moveTo(c, c);
      ctx.arc(c, c, r, a0, a0 + seg);
      ctx.closePath();
      ctx.fillStyle = colorAt(k, n);
      ctx.fill();
      ctx.lineWidth = n > 14 ? 4 : 6;
      ctx.strokeStyle = '#FFFFFF';
      ctx.stroke();
    }
    var base = n <= 6 ? 42 : n <= 10 ? 34 : n <= 16 ? 28 : 22;
    for (var j = 0; j < n; j++) {
      ctx.save();
      ctx.translate(c, c);
      ctx.rotate(-Math.PI / 2 + (j + 0.5) * seg);
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.fillStyle = '#4F3328';
      var label = fitText(list[j].text, r - 140, base);
      ctx.fillText(label, r - 36, 2);
      ctx.restore();
    }
    // 가장자리 전구
    for (var b = 0; b < 24; b++) {
      var ang = (b / 24) * Math.PI * 2;
      ctx.beginPath();
      ctx.arc(c + Math.cos(ang) * (r - 16), c + Math.sin(ang) * (r - 16), 5.5, 0, Math.PI * 2);
      ctx.fillStyle = b % 2 ? '#FFFFFF' : '#FFE9A8';
      ctx.fill();
    }
  }

  function renderRows(focusIdx) {
    rowsEl.innerHTML = '';
    var n = items.length;
    items.forEach(function (it, i) {
      var li = document.createElement('li');
      li.className = 'row';
      li.dataset.i = String(i);

      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = colorAt(i, n);

      var input = document.createElement('input');
      input.type = 'text';
      input.className = 'nm-in';
      input.id = 'opt-' + i;
      input.maxLength = 14;
      input.value = it.n;
      input.placeholder = '메뉴 ' + (i + 1);
      input.setAttribute('aria-label', '메뉴 ' + (i + 1) + ' 이름');
      input.addEventListener('input', function () {
        items[i].n = input.value;
        save();
        drawWheel();
        updateCount();
        clearResult();
      });
      input.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') { e.preventDefault(); input.blur(); }
      });

      var kc = document.createElement('label');
      kc.className = 'kc';
      var kin = document.createElement('input');
      kin.type = 'number';
      kin.id = 'kc-' + i;
      kin.min = '1'; kin.max = '3000'; kin.step = '10';
      kin.setAttribute('inputmode', 'numeric');
      kin.placeholder = '-';
      kin.value = it.k == null ? '' : String(it.k);
      kin.setAttribute('aria-label', '메뉴 ' + (i + 1) + ' 칼로리');
      kin.addEventListener('input', function () {
        var v = Number(kin.value);
        items[i].k = kin.value === '' || !(v > 0) ? null : Math.min(3000, Math.round(v));
        save();
        clearResult();
      });
      kc.appendChild(kin);
      kc.appendChild(document.createTextNode('kcal'));

      var del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '×';
      del.setAttribute('aria-label', (it.n || '메뉴 ' + (i + 1)) + ' 삭제');
      del.disabled = n <= MIN;
      del.addEventListener('click', function () { removeItem(i); });

      li.appendChild(dot);
      li.appendChild(input);
      li.appendChild(kc);
      li.appendChild(del);
      rowsEl.appendChild(li);
    });
    var full = n >= MAX;
    addBtn.disabled = full;
    newInput.disabled = full;
    newKcal.disabled = full;
    newInput.placeholder = full ? '최대 ' + MAX + '개까지 넣을 수 있어요' : '먹고 싶은 메뉴를 적어요';
    updateCount();
    if (typeof focusIdx === 'number') {
      var li2 = rowsEl.children[focusIdx];
      if (li2) li2.scrollIntoView({ block: 'nearest' });
    }
  }

  function updateCount() {
    countEl.textContent = '지금 ' + valid().length + '개가 돌림판에 올라가 있어요 (최대 ' + MAX + '개)';
  }

  function showMsg(t) { msgEl.textContent = t || ''; }

  function addItem(e) {
    if (e) e.preventDefault();
    if (spinning) return;
    var t = newInput.value.trim();
    if (!t) { showMsg('메뉴 이름을 먼저 적어주세요'); newInput.focus(); return; }
    if (items.length >= MAX) { showMsg('메뉴는 최대 ' + MAX + '개까지예요'); return; }
    if (items.some(function (x) { return x.n.trim() === t; })) { showMsg('"' + t + '"은(는) 이미 있어요'); return; }
    var k = null;
    if (newKcal.value !== '') {
      var v = Number(newKcal.value);
      if (!(v > 0)) { showMsg('칼로리는 1 이상의 숫자로 적어주세요'); newKcal.focus(); return; }
      k = Math.min(3000, Math.round(v));
    } else {
      var d = lookupDefault(t);
      if (d) k = d[1];
    }
    var d2 = lookupDefault(t);
    items.push({ n: t, k: k, e: d2 ? d2[2] : FALLBACK_EMOJI });
    newInput.value = '';
    newKcal.value = '';
    showMsg('');
    save();
    renderRows(items.length - 1);
    drawWheel();
    clearResult();
    newInput.focus();
  }

  function removeItem(i) {
    if (items.length <= MIN || spinning) return;
    items.splice(i, 1);
    showMsg('');
    save();
    renderRows();
    drawWheel();
    clearResult();
  }

  function clearResult() {
    lastWinner = null;
    resultEl.className = 'result';
    resultEl.innerHTML = '<span class="hint">돌림판을 돌려서 정해봐요</span>';
    burnEl.hidden = true;
    var won = rowsEl.querySelector('.won');
    if (won) won.classList.remove('won');
  }

  function randInt(n) {
    try {
      var a = new Uint32Array(1);
      crypto.getRandomValues(a);
      return a[0] % n;
    } catch (e) {
      return Math.floor(Math.random() * n);
    }
  }

  function confetti() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var k = 0; k < 28; k++) {
      var p = document.createElement('span');
      p.className = 'confetti';
      p.style.left = (Math.random() * 100) + '%';
      p.style.background = PALETTE[k % PALETTE.length];
      p.style.animationDelay = (Math.random() * 0.4) + 's';
      resultEl.appendChild(p);
      (function (el) { setTimeout(function () { el.remove(); }, 2200); })(p);
    }
  }

  function fmtTime(mins) {
    if (mins < 1) mins = 1;
    var h = Math.floor(mins / 60), m = mins % 60;
    if (h === 0) return m + '분';
    if (m === 0) return h + '시간';
    return h + '시간 ' + m + '분';
  }

  function comment(k) {
    if (k <= 400) return '가볍게 먹기 딱 좋아요';
    if (k <= 650) return '든든한 한 끼예요';
    if (k <= 850) return '꽤 푸짐해요';
    return '오늘은 운동 각오하기!';
  }

  function renderBurn() {
    if (!lastWinner) { burnEl.hidden = true; return; }
    burnEl.hidden = false;
    chipsEl.innerHTML = '';
    var k = lastWinner.k;
    if (k == null) {
      burnNote.textContent = '';
      var li0 = document.createElement('li');
      li0.className = 'burn-empty';
      li0.style.gridColumn = '1 / -1';
      li0.textContent = '메뉴 목록에서 이 메뉴의 kcal를 적으면 운동 시간을 계산해줘요';
      chipsEl.appendChild(li0);
      return;
    }
    var w = Number(weightEl.value);
    if (!(w >= 30 && w <= 150)) w = 55;
    ACTIVITIES.forEach(function (a) {
      var mins = Math.round(k / (a.met * w) * 60);
      var li = document.createElement('li');
      li.className = 'chip' + (a.star ? ' star' : '');
      var em = document.createElement('span'); em.className = 'em'; em.textContent = a.e;
      var nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = a.n;
      var tm = document.createElement('span'); tm.className = 'tm'; tm.textContent = fmtTime(mins);
      li.appendChild(em); li.appendChild(nm); li.appendChild(tm);
      chipsEl.appendChild(li);
    });
    burnNote.textContent = lastWinner.text + ' ' + k + 'kcal, 몸무게 ' + w + 'kg 기준으로 계산한 대략 시간이에요';
  }

  function showResult(w) {
    lastWinner = w;
    resultEl.className = 'result pop';
    resultEl.innerHTML = '<span class="big-emoji"></span><small>오늘의 메뉴는</small><strong></strong><div class="kcal-badge"></div><div class="comment"></div>';
    resultEl.querySelector('.big-emoji').textContent = w.e || FALLBACK_EMOJI;
    resultEl.querySelector('strong').textContent = w.text;
    var badge = resultEl.querySelector('.kcal-badge');
    var cm = resultEl.querySelector('.comment');
    if (w.k == null) {
      badge.className = 'kcal-badge none';
      badge.textContent = '칼로리 정보가 없어요';
      cm.textContent = '';
    } else {
      badge.innerHTML = '';
      badge.appendChild(document.createTextNode('약 ' + w.k + ' kcal'));
      var sm = document.createElement('small'); sm.textContent = '1인분'; badge.appendChild(sm);
      cm.textContent = comment(w.k);
    }
    renderBurn();
  }

  function setBusy(b) {
    spinning = b;
    spinBtn.disabled = b;
    resetBtn.disabled = b;
    var full = items.length >= MAX;
    newInput.disabled = b || full;
    newKcal.disabled = b || full;
    addBtn.disabled = b || full;
  }

  function spin() {
    if (spinning) return;
    var list = valid();
    if (list.length < 2) {
      resultEl.className = 'result';
      resultEl.innerHTML = '<span class="hint">메뉴를 2개 이상 적어주세요</span>';
      return;
    }
    setBusy(true);
    hub.classList.add('spinning');
    clearResult();
    resultEl.innerHTML = '<span class="hint">두근두근...</span>';

    var n = list.length;
    var winner = randInt(n);
    var segDeg = 360 / n;
    var jitter = (Math.random() - 0.5) * segDeg * 0.7;
    var desired = (((-(winner + 0.5) * segDeg + jitter) % 360) + 360) % 360;
    var curMod = ((rotation % 360) + 360) % 360;
    var delta = (desired - curMod + 360) % 360;
    var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    var turns = reduce ? 1 : 6;
    var dur = reduce ? 600 : SPIN_MS;
    rotation = rotation + turns * 360 + delta;

    canvas.style.transition = 'transform ' + dur + 'ms cubic-bezier(.12,.72,.08,1)';
    canvas.style.transform = 'rotate(' + rotation + 'deg)';

    clearTimeout(timer);
    timer = setTimeout(function () {
      setBusy(false);
      spinBtn.textContent = '한 번 더 뽑기';
      hub.classList.remove('spinning');
      var w = list[winner];
      showResult(w);
      var row = rowsEl.querySelector('.row[data-i="' + w.i + '"]');
      if (row) { row.classList.add('won'); row.scrollIntoView({ block: 'nearest' }); }
      confetti();
    }, dur + 80);
  }

  function resetItems() {
    if (spinning) return;
    if (!resetArmed) {
      resetArmed = true;
      resetBtn.textContent = '정말 되돌릴까요? 한 번 더 누르면 돼요';
      clearTimeout(resetTimer);
      resetTimer = setTimeout(disarm, 4000);
      return;
    }
    disarm();
    items = defaultItems();
    save();
    showMsg('');
    renderRows();
    drawWheel();
    clearResult();
  }
  function disarm() {
    resetArmed = false;
    resetBtn.textContent = '기본 메뉴로 되돌리기';
  }

  spinBtn.addEventListener('click', spin);
  form.addEventListener('submit', addItem);
  resetBtn.addEventListener('click', resetItems);
  newInput.addEventListener('input', function () { showMsg(''); });
  weightEl.addEventListener('input', function () {
    var w = Number(weightEl.value);
    if (w >= 30 && w <= 150) { saveWeight(w); renderBurn(); }
  });

  renderRows();
  clearResult();
  drawWheel();
  if (document.fonts && document.fonts.load) {
    document.fonts.load('40px Jua', '메뉴').then(drawWheel).catch(function () {});
    if (document.fonts.ready) document.fonts.ready.then(drawWheel).catch(function () {});
  }
})();
</script>

</body>
</html>
